<body data-hen-standalone="true">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main class="hen-doorway" id="main-content">
        <h1>hen</h1>
        <p>Opening the live Teia and OBJKT feed with collecting filters, wallet-owned flags, and direct collect links.</p>
        <a href="/hen/" data-hen-launch>Retry opening the feed</a>
        <noscript><p>JavaScript is required for the live feed. <a href="/">Return to Tezos Systems</a>.</p></noscript>
    </main>
    <section data-site-circulation data-site-context="hen"></section>
    <footer data-site-footer data-site-context="hen"></footer>

    <div id="hen-overlay" class="hen-overlay" role="main" aria-label="HEN live Tezos NFT feed">
        <div id="hen-boot" class="hen-boot"></div>
        <div class="hen-header">
            <div class="hen-logo">hen</div>
            <div class="hen-source-tabs" role="group" aria-label="NFT source filter">
                <span class="hen-filter-group-label hen-source-label" aria-hidden="true">source</span>
                <button type="button" class="hen-source-tab" data-hen-mode="all" aria-pressed="true">all</button>
                <button type="button" class="hen-source-tab" data-hen-mode="teia" aria-pressed="false">teia</button>
                <button type="button" class="hen-source-tab" data-hen-mode="objkt" aria-pressed="false">objkt</button>
            </div>
            <div id="hen-mint-count" class="hen-mint-count"></div>
            <button class="hen-close" type="button" aria-label="Exit HEN live feed" title="Exit HEN live feed">×</button>
        </div>
        <div id="hen-status-strip" class="hen-status-strip">
            <span id="hen-status-line" class="hen-status-line" aria-live="polite"></span>
            <button type="button" id="hen-mobile-filter-toggle" class="hen-mobile-filter-toggle" aria-expanded="false" aria-controls="hen-filterbar hen-wallet-controls">filters</button>
            <div id="hen-filterbar" class="hen-filterbar" aria-label="HEN feed filters">
                <div class="hen-filter-group" role="group" aria-label="Maximum price">
                    <span class="hen-filter-group-label" aria-hidden="true">price ꜩ</span>
                    <button type="button" id="hen-filter-listed" class="hen-filter-toggle" aria-pressed="false">for sale</button>
                    <button type="button" class="hen-filter-chip" data-hen-price="1000000" aria-pressed="false">≤1</button>
                    <button type="button" class="hen-filter-chip" data-hen-price="5000000" aria-pressed="false">≤5</button>
                    <button type="button" class="hen-filter-chip" data-hen-price="25000000" aria-pressed="false">≤25</button>
                    <button type="button" class="hen-filter-chip" data-hen-price="any" aria-pressed="true">any</button>
                </div>
                <label class="hen-search-label" for="hen-search-input">search</label>
                <input id="hen-search-input" class="hen-search-input" type="search" placeholder="name..." autocomplete="off" spellcheck="false">
                <div class="hen-filter-group" role="group" aria-label="Edition size">
                    <span class="hen-filter-group-label" aria-hidden="true">edition</span>
                    <button type="button" class="hen-filter-chip" data-hen-edition="1" aria-pressed="false">1/1</button>
                    <button type="button" class="hen-filter-chip" data-hen-edition="10" aria-pressed="false">≤10</button>
                    <button type="button" class="hen-filter-chip" data-hen-edition="any" aria-pressed="true">any</button>
                </div>
                <div class="hen-filter-group" role="group" aria-label="Sort feed">
                    <span class="hen-filter-group-label" aria-hidden="true">sort</span>
                    <button type="button" class="hen-filter-chip" data-hen-sort="newest" aria-pressed="true">newest</button>
                    <button type="button" class="hen-filter-chip" data-hen-sort="cheapest" aria-pressed="false">cheap</button>
                    <button type="button" class="hen-filter-chip" data-hen-sort="scarce" aria-pressed="false">scarce</button>
                </div>
                <button type="button" id="hen-filter-saved" class="hen-filter-icon" aria-pressed="false" title="Saved pieces">♥</button>
                <button type="button" id="hen-filter-hide-owned" class="hen-filter-chip" aria-pressed="false">hide owned</button>
                <button type="button" id="hen-filter-shuffle" class="hen-filter-icon" title="Shuffle feed">↯</button>
            </div>
            <div id="hen-wallet-controls" class="hen-wallet-controls" aria-label="HEN wallet setup">
                <span id="hen-wallet-status" class="hen-wallet-status">connect to flag pieces you own</span>
                <button type="button" id="hen-wallet-connect" class="hen-wallet-button hen-wallet-primary">connect</button>
                <label class="hen-wallet-paste-label" for="hen-wallet-input">or paste</label>
                <input id="hen-wallet-input" class="hen-wallet-input" type="text" placeholder="tz1… or name.tez" aria-label="Wallet address or Tezos domain" spellcheck="false" autocomplete="off">
                <button type="button" id="hen-wallet-save" class="hen-wallet-button">set</button>
                <button type="button" id="hen-wallet-clear" class="hen-wallet-button hen-wallet-clear" title="Clear HEN wallet">×</button>
            </div>
        </div>
        <div class="hen-feed">
            <section id="hen-profile-panel" class="hen-profile-panel" hidden></section>
            <div id="hen-now-line" class="hen-now-line" aria-hidden="true"><span>now · --:--:--</span></div>
            <div id="hen-grid" class="hen-grid"></div>
            <div id="hen-loading" class="hen-loading">indexing...</div>
        </div>
        <div class="hen-cli">
            <span class="hen-cli-prompt">&gt;</span>
            <input id="hen-cli-input" class="hen-cli-input" type="text" placeholder="type help for commands" autocomplete="off" spellcheck="false">
        </div>
        <div id="hen-expanded" class="hen-expanded">
            <button class="hen-expanded-close" type="button" aria-label="Close NFT details">×</button>
            <div class="hen-expanded-inner"></div>
        </div>
    </div>
    <script type="module" src="/js/landing/site-nav.js?v=471"></script>
</body>
</html>
