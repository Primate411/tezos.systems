<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Governance — tezos.systems</title>
<link rel="canonical" href="https://tezos.systems/widgets/governance.html">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0A0E1A;--accent:#5B8DEF;--text:#D8E0F0;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;transition:background 0.3s,color 0.3s;
  }
  .widget{
    width:100%;height:100%;padding:12px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;background:var(--glass);border:1px solid var(--border);
    border-radius:12px;position:relative;overflow:hidden;
  }
  .widget::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.03) 0%,transparent 70%);
    pointer-events:none;
  }
  .label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;font-weight:500}
  .period{
    font-family:'Courier New',monospace;
    font-size:clamp(14px,4.5vw,24px);
    font-weight:700;color:var(--accent);line-height:1;
    letter-spacing:0.02em;
  }
  .period.loading{opacity:0.3;animation:pulse 1.4s ease-in-out infinite}
  .progress-wrap{width:80%;max-width:180px;margin:2px 0}
  .progress-bar{
    height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:var(--accent);border-radius:2px;
    transition:width 0.8s cubic-bezier(0.4,0,0.2,1);width:0%;
  }
  .progress-label{font-size:9px;opacity:0.4;margin-top:2px;display:flex;justify-content:space-between}
  .period-badge{
    font-size:10px;opacity:0.55;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
    border-radius:5px;padding:1px 6px;
  }
  .sub{font-size:9px;opacity:0.35}
  .footer{position:absolute;bottom:5px;right:8px;font-size:9px;opacity:0.2;text-decoration:none;color:inherit;transition:opacity 0.2s}
  .footer:hover{opacity:0.5}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:middle;animation:blink 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.6}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<link rel="stylesheet" href="./runtime.css">
</head>
<body>
<div class="widget">
  <div class="label"><span class="dot"></span>Governance</div>
  <div class="period loading" id="period">Loading…</div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="progress-label"><span id="prog-start">0%</span><span id="prog-end">100%</span></div>
  </div>
  <div class="period-badge" id="cycle-info">Cycle —</div>
  <div class="widget-meta">
    <span class="widget-freshness" data-state="loading">Loading source…</span>
    <button class="widget-retry" type="button" aria-label="Refresh widget data">Refresh</button>
    <a class="footer" href="https://tezos.systems/?utm_source=tezos_systems&utm_medium=widget_attribution&utm_campaign=tezos_systems_widgets&utm_content=governance" target="_blank" rel="noopener">powered by tezos.systems -></a>
  </div>
</div>
<script type="module">
import {
  applyWidgetTheme, createWidgetView, fetchWidgetBatch, setWidgetText,
  startWidgetRefresh, WIDGET_ENDPOINTS, requireWidgetNumber
} from './runtime.js';

const settings = applyWidgetTheme();
const periodEl = document.getElementById('period');
const progressEl = document.getElementById('progress');
const progStartEl = document.getElementById('prog-start');
const progEndEl = document.getElementById('prog-end');
const cycleInfoEl = document.getElementById('cycle-info');
const view = createWidgetView({ empty: () => setWidgetText(periodEl, '—') });
const PERIOD_NAMES = {
  proposal: 'Proposal', exploration: 'Exploration Vote', cooldown: 'Cooldown',
  promotion: 'Promotion Vote', adoption: 'Adoption'
};
async function fetchData() {
  const [period, head] = await fetchWidgetBatch([
    WIDGET_ENDPOINTS.currentVotingPeriod(), WIDGET_ENDPOINTS.head()
  ]);
  if (!period || !Object.hasOwn(PERIOD_NAMES, period.kind)) throw new Error('Unavailable voting period');
  const first = requireWidgetNumber(period.firstLevel, { integer: true, minimum: 1 });
  const last = requireWidgetNumber(period.lastLevel, { integer: true, minimum: first });
  const level = requireWidgetNumber(head?.level, { integer: true, minimum: first });
  if (level > last) throw new Error('Voting period and head are out of sync');
  const epoch = requireWidgetNumber(period.epoch, { integer: true });
  const index = requireWidgetNumber(period.index, { integer: true });
  const pct = ((level - first + 1) / (last - first + 1)) * 100;
  return () => {
    setWidgetText(periodEl, PERIOD_NAMES[period.kind]);
    periodEl.classList.remove('loading');
    progressEl.style.width = pct.toFixed(1) + '%';
    setWidgetText(progStartEl, pct.toFixed(0) + '%');
    setWidgetText(progEndEl, 'Ends Epoch ' + epoch);
    setWidgetText(cycleInfoEl, 'Epoch ' + epoch + ' · Period ' + index);
  };
}
startWidgetRefresh(fetchData, settings.refreshMs, view);
</script>
</body>
</html>
