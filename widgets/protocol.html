<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocol — tezos.systems</title>
<link rel="canonical" href="https://tezos.systems/widgets/protocol.html">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0A0E1A;--accent:#5B8DEF;--text:#D8E0F0;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;transition:background 0.3s,color 0.3s;
  }
  .widget{
    width:100%;height:100%;padding:12px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:5px;background:var(--glass);border:1px solid var(--border);
    border-radius:12px;position:relative;overflow:hidden;
  }
  .widget::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.03) 0%,transparent 70%);
    pointer-events:none;
  }
  .label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;font-weight:500}
  .protocol{
    font-family:'Courier New',monospace;
    font-size:clamp(16px,5vw,28px);
    font-weight:700;color:var(--accent);line-height:1;
    letter-spacing:0.02em;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .protocol.loading{opacity:0.3;animation:pulse 1.4s ease-in-out infinite}
  .stats-row{display:flex;gap:8px;align-items:center;margin-top:2px}
  .badge{
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    border-radius:6px;padding:2px 7px;font-size:10px;
    display:flex;align-items:center;gap:4px;
  }
  .badge-accent{color:var(--accent);font-weight:600;font-family:'Courier New',monospace}
  .sub{font-size:9px;opacity:0.35}
  .footer{position:absolute;bottom:5px;right:8px;font-size:9px;opacity:0.2;text-decoration:none;color:inherit;transition:opacity 0.2s}
  .footer:hover{opacity:0.5}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:middle;animation:blink 2s ease-in-out infinite}
  .upgrade-icon{font-size:11px}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.6}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<link rel="stylesheet" href="./runtime.css">
</head>
<body>
<div class="widget">
  <div class="label"><span class="dot"></span>Protocol</div>
  <div class="protocol loading" id="proto">Loading…</div>
  <div class="stats-row">
    <div class="badge">
      <span class="upgrade-icon">⚡</span>
      <span class="badge-accent" id="upgrades">—</span>
      <span style="opacity:0.5;font-size:9px">upgrades</span>
    </div>
    <div class="badge">
      <span style="opacity:0.5;font-size:9px">v</span>
      <span class="badge-accent" id="version">—</span>
    </div>
  </div>
  <div class="sub">Self-amending · On-chain upgrade path</div>
  <div class="widget-meta">
    <span class="widget-freshness" data-state="loading">Loading source…</span>
    <button class="widget-retry" type="button" aria-label="Refresh widget data">Refresh</button>
    <a class="footer" href="https://tezos.systems/?utm_source=tezos_systems&utm_medium=widget_attribution&utm_campaign=tezos_systems_widgets&utm_content=protocol" target="_blank" rel="noopener">powered by tezos.systems -></a>
  </div>
</div>
<script type="module">
import {
  applyWidgetTheme, createWidgetView, fetchWidgetBatch, setWidgetText,
  startWidgetRefresh, WIDGET_ENDPOINTS, protocolAlias, requireWidgetProtocol
} from './runtime.js';
import { countProtocolUpgrades } from '../js/core/protocol-count.js';

const settings = applyWidgetTheme();
const protoEl = document.getElementById('proto');
const upgradesEl = document.getElementById('upgrades');
const versionEl = document.getElementById('version');
const view = createWidgetView({ empty: () => setWidgetText(protoEl, '—') });
async function fetchData() {
  const [proto, all] = await fetchWidgetBatch([
    WIDGET_ENDPOINTS.currentProtocol(),
    WIDGET_ENDPOINTS.protocols()
  ]);
  requireWidgetProtocol(proto);
  if (!Array.isArray(all) || !all.length) throw new Error('Unavailable protocol history');
  all.forEach(requireWidgetProtocol);
  const upgrades = countProtocolUpgrades(all, 0);
  return () => {
    setWidgetText(protoEl, protocolAlias(proto));
    protoEl.classList.remove('loading');
    setWidgetText(upgradesEl, upgrades);
    setWidgetText(versionEl, proto.code);
  };
}
startWidgetRefresh(fetchData, settings.refreshMs, view);
</script>
</body>
</html>
