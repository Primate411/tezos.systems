<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baker Card — tezos.systems</title>
<link rel="canonical" href="https://tezos.systems/widgets/baker-card.html">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0A0E1A;--accent:#5B8DEF;--text:#D8E0F0;--glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;transition:background 0.3s,color 0.3s;
    font-size:13px;
  }
  .widget{
    width:100%;height:100%;padding:10px 14px;
    display:flex;flex-direction:column;justify-content:center;
    gap:6px;background:var(--glass);border:1px solid var(--border);
    border-radius:12px;position:relative;overflow:hidden;
  }
  .widget::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 30% 0%,rgba(255,255,255,0.03) 0%,transparent 60%);
    pointer-events:none;
  }
  .header{display:flex;align-items:center;gap:8px}
  .avatar{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    background:rgba(255,255,255,0.06);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--accent);font-weight:700;
    font-family:'Courier New',monospace;
  }
  .baker-info{flex:1;min-width:0}
  .baker-name{
    font-size:11px;font-weight:600;color:var(--accent);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:'Courier New',monospace;
  }
  .baker-addr{font-size:9px;opacity:0.35;font-family:'Courier New',monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:#22c55e;box-shadow:0 0 6px #22c55e;
  }
  .status-dot.inactive{background:#ef4444;box-shadow:0 0 6px #ef4444}
  .stats-grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;
  }
  .stat{
    background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
    border-radius:6px;padding:5px 6px;text-align:center;
  }
  .stat-val{
    font-family:'Courier New',monospace;font-size:12px;font-weight:700;
    color:var(--accent);line-height:1;
  }
  .stat-val.loading{opacity:0.3;animation:pulse 1.4s ease-in-out infinite}
  .stat-lbl{font-size:8px;opacity:0.4;margin-top:2px;letter-spacing:0.05em}
  .no-baker{
    text-align:center;opacity:0.4;font-size:11px;padding:10px 0;
  }
  .footer{position:absolute;bottom:5px;right:8px;font-size:9px;opacity:0.2;text-decoration:none;color:inherit;transition:opacity 0.2s}
  .footer:hover{opacity:0.5}
  .label{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;font-weight:500;margin-bottom:1px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:middle;animation:blink 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.6}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<link rel="stylesheet" href="./runtime.css">
</head>
<body>
<div class="widget" id="widget">
  <div class="label"><span class="dot"></span>Baker Report</div>
  <div id="content">
    <div class="no-baker">Add ?baker=tz1… to URL</div>
  </div>
  <div class="widget-meta">
    <span class="widget-freshness" data-state="loading">Loading source…</span>
    <button class="widget-retry" type="button" aria-label="Refresh widget data">Refresh</button>
    <a class="footer" href="https://tezos.systems/?utm_source=tezos_systems&utm_medium=widget_attribution&utm_campaign=tezos_systems_widgets&utm_content=baker-card" target="_blank" rel="noopener">powered by tezos.systems -></a>
  </div>
</div>
<script type="module">
import {
  applyWidgetTheme, createWidgetView, setWidgetText, syncWidgetHtml, widgetNumber,
  escapeHtml,
  fetchWidgetJson,
  formatCompact,
  formatCount,
  shortAddress,
  startWidgetRefresh,
  WIDGET_ENDPOINTS
} from './runtime.js';

(function(){
  const settings=applyWidgetTheme();
  const baker=settings.params.get('baker');

  const contentEl=document.getElementById('content');

  if(!baker) {
    setWidgetText(document.querySelector('.widget-freshness'),'No baker selected');
    document.querySelector('.widget-freshness').dataset.state='configuration';
    document.querySelector('.widget-retry').hidden=true;
    return;
  }
  setWidgetText(contentEl.querySelector('.no-baker'),'Loading baker…');
  const view=createWidgetView({notFound:true,empty:error=>setWidgetText(contentEl.querySelector('.no-baker'),error.status===404?'Baker not found':'Baker unavailable')});

  async function fetchData(){
      const d=await fetchWidgetJson(WIDGET_ENDPOINTS.baker(baker));
      if(!d || d.address!==baker || typeof d.active!=='boolean') throw new Error('Unavailable baker record');
      const name=typeof d.alias==='string'&&d.alias?d.alias:shortAddress(d.address);
      const staking=widgetNumber(d.stakingBalance);
      const delegators=widgetNumber(d.numDelegators);
      const votingPower=widgetNumber(d.votingPower);
      const active=d.active!==false;

      return () => syncWidgetHtml(contentEl,`
        <div class="header">
          <div class="avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>
          <div class="baker-info">
            <div class="baker-name">${escapeHtml(name)}</div>
            <div class="baker-addr">${escapeHtml(d.address)}</div>
          </div>
          <div class="status-dot ${active?'':'inactive'}" role="img" aria-label="${active?'Active baker':'Inactive baker'}"></div>
        </div>
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-val">${staking!==null&&staking>=0?formatCompact(staking/1e6):'—'}</div>
            <div class="stat-lbl">Staking Balance</div>
          </div>
          <div class="stat">
            <div class="stat-val">${delegators!==null&&Number.isSafeInteger(delegators)&&delegators>=0?formatCount(delegators):'—'}</div>
            <div class="stat-lbl">Delegators</div>
          </div>
          <div class="stat">
            <div class="stat-val">${votingPower!==null&&votingPower>=0?formatCompact(votingPower/1e6):'—'}</div>
            <div class="stat-lbl">Voting Power</div>
          </div>
        </div>
      `);
  }

  startWidgetRefresh(fetchData,settings.refreshMs,view);
})();
</script>
</body>
</html>
