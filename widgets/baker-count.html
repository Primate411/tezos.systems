<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Bakers — tezos.systems</title>
<link rel="canonical" href="https://tezos.systems/widgets/baker-count.html">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0E1A;--accent:#5B8DEF;--text:#D8E0F0;
    --glass:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
    --radius:12px;--font-mono:'Courier New',monospace;
  }
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;transition:background 0.3s,color 0.3s;
  }
  .widget{
    width:100%;height:100%;padding:12px 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius);
    position:relative;
    overflow:hidden;
  }
  .widget::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.03) 0%,transparent 70%);
    pointer-events:none;
  }
  .label{
    font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
    opacity:0.55;font-weight:500;
  }
  .value{
    font-family:var(--font-mono);
    font-size:clamp(28px,8vw,52px);
    font-weight:700;
    color:var(--accent);
    line-height:1;
    letter-spacing:-0.02em;
    transition:opacity 0.2s;
  }
  .value.loading{opacity:0.3;animation:pulse 1.4s ease-in-out infinite}
  .sub{font-size:10px;opacity:0.4;margin-top:2px}
  .footer{
    position:absolute;bottom:5px;right:8px;
    font-size:9px;opacity:0.2;text-decoration:none;color:inherit;
    transition:opacity 0.2s;
  }
  .footer:hover{opacity:0.5}
  .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--accent);margin-right:4px;vertical-align:middle;
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.6}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
<link rel="stylesheet" href="./runtime.css">
</head>
<body>
<div class="widget">
  <div class="label"><span class="dot"></span>Active Bakers</div>
  <div class="value loading" id="val">—</div>
  <div class="sub" id="sub">Tezos network</div>
  <div class="widget-meta">
    <span class="widget-freshness" data-state="loading">Loading source…</span>
    <button class="widget-retry" type="button" aria-label="Refresh widget data">Refresh</button>
    <a class="footer" href="https://tezos.systems/?utm_source=tezos_systems&utm_medium=widget_attribution&utm_campaign=tezos_systems_widgets&utm_content=baker-count" target="_blank" rel="noopener">powered by tezos.systems -></a>
  </div>
</div>
<script type="module">
import {
  applyWidgetTheme, createWidgetView, fetchWidgetJson, setWidgetText,
  startWidgetRefresh, WIDGET_ENDPOINTS, formatCount, requireWidgetNumber
} from './runtime.js';

const settings = applyWidgetTheme();
const valEl = document.getElementById('val');
const subEl = document.getElementById('sub');
const view = createWidgetView();
async function fetchData() {
  const count = requireWidgetNumber(await fetchWidgetJson(WIDGET_ENDPOINTS.activeBakerCount()), { integer: true });
  return () => {
    setWidgetText(valEl, formatCount(count));
    valEl.classList.remove('loading');
    setWidgetText(subEl, 'Active on Tezos mainnet');
  };
}
startWidgetRefresh(fetchData, settings.refreshMs, view);
</script>
</body>
</html>
