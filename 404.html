    <title>404 — Tezos Systems</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        // Turn recognizable chain objects into native Tezos Systems receipts.
        (function() {
            var rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '');
            var path = rawPath;
            try { path = decodeURIComponent(rawPath); } catch (error) {}
            var isAccount = /^tz[1-4][a-zA-Z0-9]{33}$/.test(path);
            var isContract = /^KT1[a-zA-Z0-9]{33}$/.test(path);
            var isDomain = path.length <= 253 && /^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+tez$/i.test(path);
            var isOperation = /^o[a-zA-Z0-9]{50}$/.test(path);
            var isBlockHash = /^B[a-zA-Z0-9]{50}$/.test(path);
            var isBlockLevel = /^\d{4,}$/.test(path);
            if (path.toLowerCase() === 'my') {
                window.location.replace('/' + window.location.search + '#my-tezos');
            } else if (isAccount || isDomain) {
                window.location.replace('/' + window.location.search + '#my-baker=' + encodeURIComponent(path));
            } else if (isContract) {
                window.location.replace('/' + window.location.search + '#contract=' + encodeURIComponent(path));
            } else if (isOperation) {
                window.location.replace('/' + window.location.search + '#operation=' + encodeURIComponent(path));
            } else if (isBlockHash || isBlockLevel) {
                window.location.replace('/' + window.location.search + '#block=' + encodeURIComponent(path));
            }
        })();
    </script>
