name: Validate Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static contracts
        run: npm run test:static

  browser-smoke:
    name: Browser smoke (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: static-contracts
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: node scripts/resolve-playwright-version.mjs

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell

      - name: Install Chromium dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          attempt=1
          while ! npx playwright install --only-shell chromium; do
            if [ "$attempt" -ge 3 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 5))
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Restore adaptive smoke costs
        id: smoke-costs
        uses: actions/cache/restore@v5
        with:
          path: .cache/smoke-suite-costs.json
          key: smoke-costs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            smoke-costs-${{ runner.os }}-

      - name: Seed smoke costs when no hosted ledger exists
        run: |
          mkdir -p .cache
          if [ ! -f .cache/smoke-suite-costs.json ]; then
            cp tests/fixtures/smoke-suite-costs.json .cache/smoke-suite-costs.json
          fi

      - name: Run browser smoke shard
        run: >-
          npm run test:smoke:ci --
          --suite-costs .cache/smoke-suite-costs.json
          --shard ${{ matrix.shard }}/6
          --artifacts-dir test-artifacts/smoke-${{ matrix.shard }}

      - name: Upload smoke results and diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: browser-smoke-${{ matrix.shard }}-of-6
          path: test-artifacts/smoke-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14

  update-smoke-costs:
    name: Learn hosted smoke timings
    if: needs.browser-smoke.result == 'success'
    needs: browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore prior adaptive smoke costs
        uses: actions/cache/restore@v5
        with:
          path: .cache/smoke-suite-costs.json
          key: smoke-costs-${{ runner.os }}-${{ github.run_id }}-learn
          restore-keys: |
            smoke-costs-${{ runner.os }}-

      - name: Download successful shard ledgers
        uses: actions/download-artifact@v6
        with:
          pattern: browser-smoke-*-of-6
          path: test-artifacts/hosted

      - name: Update adaptive smoke costs
        run: |
          mkdir -p .cache
          if [ ! -f .cache/smoke-suite-costs.json ]; then
            cp tests/fixtures/smoke-suite-costs.json .cache/smoke-suite-costs.json
          fi
          node scripts/update-smoke-costs.mjs \
            --base .cache/smoke-suite-costs.json \
            --output .cache/smoke-suite-costs.json \
            test-artifacts/hosted

      - name: Save adaptive smoke costs
        uses: actions/cache/save@v5
        with:
          path: .cache/smoke-suite-costs.json
          key: smoke-costs-${{ runner.os }}-${{ github.run_id }}

      - name: Upload adaptive timing ledger
        uses: actions/upload-artifact@v5
        with:
          name: adaptive-smoke-costs
          path: .cache/smoke-suite-costs.json
          retention-days: 30

  deploy-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: browser-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload validated site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
          include-hidden-files: true

      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
