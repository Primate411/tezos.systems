name: Collect Chamber History

on:
  schedule:
    # Capture faster-moving chamber history twice per hour.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-history:
    name: Catch up global history
    uses: ./.github/workflows/collect-data.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tezos-systems-chamber-history
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Collect and store chamber history
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set +e
          node .github/scripts/collect-chamber-history.js
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::warning::Supabase remained temporarily unavailable after bounded retries; the freshness audit will escalate only if a last-good chamber ledger exceeds its delivery budget."
            echo "### Temporary Supabase delivery interruption" >> "$GITHUB_STEP_SUMMARY"
            echo "Last-good chamber history remains published. The freshness audit will open one incident if the five-hour delivery budget is exceeded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

  audit-delivery:
    name: Verify delivered freshness
    needs: [global-history, collect]
    # Recovery dispatches must verify delivery in this run, even if collection
    # fails; do not depend on another workflow_run event being scheduled.
    if: ${{ always() && !cancelled() && github.repository == 'Primate411/tezos.systems' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/audit-generated-freshness.yml
