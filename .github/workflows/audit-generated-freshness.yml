name: Audit Generated Freshness

on:
  schedule:
    # Offset from the repository writer so the audit observes the delivered result.
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh Generated Surfaces, Collect Tezos Stats, Collect Chamber History, Refresh TezosCRP Awards, Refresh Chain Comparison]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: tezos-systems-generated-freshness-audit
  cancel-in-progress: true

jobs:
  audit:
    # Recheck current main after trusted delivery, never execute PR/fork code.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit committed generated artifacts
        id: generated
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check:generated:freshness 2>&1 | tee "$RUNNER_TEMP/generated-freshness.log"

      - name: Audit historical ledgers
        id: history
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          npm run check:supabase:freshness 2>&1 | tee "$RUNNER_TEMP/history-freshness.log"

      - name: Reconcile one freshness incident
        if: always()
        uses: actions/github-script@v8
        env:
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
          GENERATED_OUTCOME: ${{ steps.generated.outcome }}
          HISTORY_OUTCOME: ${{ steps.history.outcome }}
          GENERATED_LOG: ${{ runner.temp }}/generated-freshness.log
          HISTORY_LOG: ${{ runner.temp }}/history-freshness.log
        with:
          script: |
            await require('./.github/scripts/reconcile-freshness-incident.js')({ github, context, core });
