name: Collect Tezos Stats

on:
  schedule:
    # Run every 2 hours at :05 past the hour
    - cron: '5 */2 * * *'
  workflow_dispatch: # Allow manual triggering
  workflow_call: # Reuse the same collector for independent catch-up opportunities.
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true

jobs:
  collect:
    runs-on: ubuntu-latest
    concurrency:
      group: tezos-systems-global-history
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Collect and store data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set +e
          node .github/scripts/collect-data.js
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::warning::Supabase remained temporarily unavailable after bounded retries; the freshness audit will escalate only if the last-good history exceeds its delivery budget."
            echo "### Temporary Supabase delivery interruption" >> "$GITHUB_STEP_SUMMARY"
            echo "The last-good global history remains published. The freshness audit will open one incident if the five-hour delivery budget is exceeded." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
