name: Refresh Generated Surfaces

on:
  schedule:
    # Refresh dynamic generated data on a six-hour cadence. Each data family is
    # isolated so one upstream outage cannot block unrelated last-good updates.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tezos-systems-repository-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh isolated generated-data lanes
        id: refresh
        env:
          # Optional: absent credentials use the public paginated REST API.
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
        continue-on-error: true
        run: npm run refresh:generated:scheduled -- --report "$RUNNER_TEMP/generated-refresh-report.json"

      - name: Audit complete site contracts
        id: site_contracts
        if: always()
        continue-on-error: true
        run: npm run test:static

      - name: Commit successful lane changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/generated-refresh-report.json" ]; then
            echo "Scheduled refresh did not produce a complete report; refusing to publish"
            exit 1
          fi
          mapfile -t targets < <(node scripts/refresh-scheduled-data.mjs --print-targets)
          if [ -z "$(git status --porcelain -- "${targets[@]}")" ]; then
            echo "No successful generated-data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/stamp-version.sh
          git add -- "${targets[@]}" version.json
          git commit -m "Refresh generated data lanes"
          git push
          gh workflow run ci.yml --ref main

      - name: Report failed lanes and contract audits
        if: always()
        run: |
          failed=0
          if ! node scripts/refresh-scheduled-data.mjs --check-report "$RUNNER_TEMP/generated-refresh-report.json"; then
            failed=1
          fi
          if [ "${{ steps.site_contracts.outcome }}" != "success" ]; then
            echo "Complete site contract audit failed"
            failed=1
          fi
          exit "$failed"
