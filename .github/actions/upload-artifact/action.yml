name: Upload artifact with bounded recovery
description: Retry artifact storage failures within the current job; exhausted uploads still fail.
inputs:
  name:
    description: Unique artifact name within this workflow run
    required: true
  path:
    description: Files or directory to upload
    required: true
  if-no-files-found:
    description: Missing-file policy from actions/upload-artifact
    default: warn
  retention-days:
    description: Retention period; zero uses the repository default
    default: '0'
  compression-level:
    description: ZIP compression level
    default: '6'
  include-hidden-files:
    description: Include reviewed hidden files
    default: 'false'
outputs:
  artifact-id:
    description: Successful upload artifact-id
    value: ${{ steps.third.outputs.artifact-id || steps.second.outputs.artifact-id || steps.first.outputs.artifact-id }}
  artifact-url:
    description: Successful upload artifact-url
    value: ${{ steps.third.outputs.artifact-url || steps.second.outputs.artifact-url || steps.first.outputs.artifact-url }}
  artifact-digest:
    description: Successful upload artifact-digest
    value: ${{ steps.third.outputs.artifact-digest || steps.second.outputs.artifact-digest || steps.first.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - name: Upload attempt 1
      id: first
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: false
    - name: Wait before upload attempt 2
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      shell: bash
      run: sleep 20
    - name: Upload attempt 2
      id: second
      if: ${{ !cancelled() && steps.first.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
    - name: Wait before upload attempt 3
      if: ${{ !cancelled() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
      shell: bash
      run: sleep 60
    - name: Upload attempt 3
      id: third
      if: ${{ !cancelled() && steps.first.outcome == 'failure' && steps.second.outcome == 'failure' }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        overwrite: true
